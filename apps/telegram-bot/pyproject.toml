[project]
name = "moulinex-bot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
